<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Form Example</title>
    <meta name="description" content="A simple quiz form example for week 5.">
    <meta name="author" description="Diego Mejias">
    <link rel="stylesheet" href="styles/quizz.css">
</head>

<body>
    <main>
        <h1>Quiz Form Example</h1>
        <form action="#">
            <fieldset>
                <legend>Input Fields</legend>
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" name="q1" id="q1" required>

                <label for="q2">2. How are id and class atibutes selected in CSS?</label>
                <textarea name="q2" id="q2" required></textarea>

                <label for="q3">3. Wich of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="0">Choose One...</option>
                    <option value="1">/* This is a comment */</option>
                    <option value="2">// This is a comment</option>
                    <option value="3"># This is a comment</option>
                    <option value="4">&lg; !-- This is a comment --&gt;</option>
                </select>

                <label for="q4">4. What is the margin given this declaration?</label>
                <p class="code">margin: 10px 5px 15px;</p>
                <input type="text" name="q4" id="q4" required>
            </fieldset>

            <button>Submit Quiz</button>
        </form>
    </main>
</body>

</html>
